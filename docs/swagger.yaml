basePath: /api/v1
definitions:
  test-lintaspay_internal_domain_entity.AuditLog:
    properties:
      action:
        type: string
      actor:
        type: string
      after:
        items:
          type: integer
        type: array
      before:
        items:
          type: integer
        type: array
      created_at:
        type: string
      entity_id:
        type: string
      id:
        type: string
    type: object
  test-lintaspay_internal_domain_entity.CreateDisbursementRequest:
    properties:
      account_number:
        type: string
      amount:
        minimum: 10000
        type: integer
      bank_code:
        type: string
      note:
        type: string
      recipient_name:
        type: string
    required:
    - account_number
    - amount
    - bank_code
    - recipient_name
    type: object
  test-lintaspay_internal_domain_entity.Disbursement:
    properties:
      account_number:
        type: string
      admin_fee:
        type: integer
      amount:
        type: integer
      approved_by:
        type: string
      bank_code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      note:
        type: string
      recipient_name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  test-lintaspay_internal_domain_entity.HealthStatus:
    properties:
      database:
        type: string
      status:
        type: string
    type: object
  test-lintaspay_internal_domain_entity.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  test-lintaspay_internal_domain_entity.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  test-lintaspay_internal_domain_entity.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  test-lintaspay_internal_domain_entity.UpdateStatusRequest:
    properties:
      note:
        type: string
      status:
        enum:
        - APPROVED
        - REJECTED
        type: string
    required:
    - status
    type: object
  test-lintaspay_pkg_common_httpresponse.DataResponse-test-lintaspay_internal_domain_entity_Disbursement:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/test-lintaspay_internal_domain_entity.Disbursement'
      message:
        type: string
    type: object
  test-lintaspay_pkg_common_httpresponse.DataResponse-test-lintaspay_internal_domain_entity_HealthStatus:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/test-lintaspay_internal_domain_entity.HealthStatus'
      message:
        type: string
    type: object
  test-lintaspay_pkg_common_httpresponse.DataResponse-test-lintaspay_internal_domain_entity_TokenResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/test-lintaspay_internal_domain_entity.TokenResponse'
      message:
        type: string
    type: object
  test-lintaspay_pkg_common_httpresponse.ErrorResponse:
    properties:
      code:
        type: integer
      error: {}
      message:
        type: string
    type: object
  test-lintaspay_pkg_common_httpresponse.PaginatedResponse-test-lintaspay_internal_domain_entity_AuditLog:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/test-lintaspay_internal_domain_entity.AuditLog'
        type: array
      message:
        type: string
      pagination:
        $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.Pagination'
    type: object
  test-lintaspay_pkg_common_httpresponse.PaginatedResponse-test-lintaspay_internal_domain_entity_Disbursement:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/test-lintaspay_internal_domain_entity.Disbursement'
        type: array
      message:
        type: string
      pagination:
        $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.Pagination'
    type: object
  test-lintaspay_pkg_common_httpresponse.Pagination:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  test-lintaspay_pkg_common_httpresponse.Response:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: Disbursement API for the senior backend coding test
  title: test-lintaspay API
  version: "1.0"
paths:
  /audit-logs:
    get:
      parameters:
      - description: default 1
        in: query
        name: page
        type: integer
      - description: default 20, max 100
        in: query
        name: limit
        type: integer
      - description: filter by disbursement id
        in: query
        name: entity_id
        type: string
      - description: created, status_changed, deleted
        in: query
        name: action
        type: string
      - description: YYYY-MM-DD
        in: query
        name: date_from
        type: string
      - description: YYYY-MM-DD
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.PaginatedResponse-test-lintaspay_internal_domain_entity_AuditLog'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit logs (superadmin only)
      tags:
      - audit-logs
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/test-lintaspay_internal_domain_entity.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.DataResponse-test-lintaspay_internal_domain_entity_TokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      summary: Login with username and password
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/test-lintaspay_internal_domain_entity.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      summary: Invalidate a refresh token
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/test-lintaspay_internal_domain_entity.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.DataResponse-test-lintaspay_internal_domain_entity_TokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      summary: Exchange refresh token for a new access token
      tags:
      - auth
  /disbursements:
    get:
      parameters:
      - description: default 1
        in: query
        name: page
        type: integer
      - description: default 20, max 100
        in: query
        name: limit
        type: integer
      - description: partial match on recipient_name
        in: query
        name: search
        type: string
      - description: PENDING, APPROVED, REJECTED
        in: query
        name: status
        type: string
      - description: YYYY-MM-DD
        in: query
        name: date_from
        type: string
      - description: YYYY-MM-DD
        in: query
        name: date_to
        type: string
      - description: created_at or amount
        in: query
        name: sort_by
        type: string
      - description: asc or desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.PaginatedResponse-test-lintaspay_internal_domain_entity_Disbursement'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List disbursements
      tags:
      - disbursements
    post:
      consumes:
      - application/json
      parameters:
      - description: uuid v4, makes the request idempotent for 24h
        in: header
        name: Idempotency-Key
        type: string
      - description: disbursement
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/test-lintaspay_internal_domain_entity.CreateDisbursementRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.DataResponse-test-lintaspay_internal_domain_entity_Disbursement'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a disbursement
      tags:
      - disbursements
  /disbursements/{id}:
    delete:
      parameters:
      - description: disbursement id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft delete a PENDING disbursement
      tags:
      - disbursements
    get:
      parameters:
      - description: disbursement id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.DataResponse-test-lintaspay_internal_domain_entity_Disbursement'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get one disbursement by id
      tags:
      - disbursements
  /disbursements/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: disbursement id
        in: path
        name: id
        required: true
        type: string
      - description: new status
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/test-lintaspay_internal_domain_entity.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.DataResponse-test-lintaspay_internal_domain_entity_Disbursement'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve or reject a disbursement
      tags:
      - disbursements
  /health:
    get:
      description: Check service and database availability
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.DataResponse-test-lintaspay_internal_domain_entity_HealthStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/test-lintaspay_pkg_common_httpresponse.ErrorResponse'
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the access token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
