version: "3.8"

services:
  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lintaspay-api
    ports:
      - "3000:3000"
    environment:
      # Application
      APP_NAME: ${APP_NAME:-test-lintaspay}
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-1.0.0}

      # Server
      SERVER_PORT: ${SERVER_PORT:-3000}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}

      # Idempotency
      IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-24h}

      # MySQL Database
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_lintaspay}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-10}
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-100}
      MYSQL_SSL_MODE: ${MYSQL_SSL_MODE:-false}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      # Mount logs directory (optional)
      - ./logs:/app/logs

  # MySQL database service
  mysql:
    image: mysql:8.0
    container_name: lintaspay-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_lintaspay}
    volumes:
      - mysql-data:/var/lib/mysql
      # Apply schema + seed users on first boot
      - ./migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_PASSWORD:-secret}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# Networks
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  mysql-data:
    driver: local
